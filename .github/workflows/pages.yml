# Publishes the implementation Kanban board.
#
# The board is the one artefact this repository can show a visitor without
# running anything: 17 tickets, 16 of them Done, and the single open item is a
# recurring maintenance risk rather than a defect. It makes "this project is
# finished and stayed finished" visible as a shape rather than as a claim in
# prose.
#
# Just the board. The specification, feature files, driver and ADRs are not
# published: the board is a single self-contained file, and shipping the rest
# would put a second copy of SPECIFICATION.md at a URL that no gate keeps in
# step with the repository.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - bfx-ws-screenplay_implementation-kanban_v1.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deployment; let it finish and queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the Kanban board
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The board is a single self-contained file (generated by
      # portfolio-kanban-generator: no framework, no CDN, no vendored files), so
      # the site is just that one file served as index.html.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp bfx-ws-screenplay_implementation-kanban_v1.html _site/index.html

      # A published board that renders zero cards has shipped before elsewhere in
      # this portfolio. Assert the payload is present and carries a known ticket
      # before deploying, so an empty shell fails here rather than going live.
      - name: The published copy carries the board
        run: |
          grep -q 'id="payload-tickets"' _site/index.html
          grep -q '"id":"RISK-1"' _site/index.html
          echo "payload present"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 30
